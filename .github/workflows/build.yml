name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.2)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-license: true
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Remove Termux-only aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Set up keystore for signing
        if: secrets.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SP: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KA: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KP: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/ghost-rain.jks"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/ghost-rain.jks
          RELEASE_STORE_PASSWORD=$SP
          RELEASE_KEY_ALIAS=$KA
          RELEASE_KEY_PASSWORD=$KP
          EOF

      - name: Build release APK
        run: bash ./gradlew assembleRelease

      - name: Verify APK exists
        run: |
          ls -R app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            app/build/outputs/apk/release/app-release.apk
