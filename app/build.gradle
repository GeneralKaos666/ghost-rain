plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.ghostrain'
    compileSdk 34

    defaultConfig {
        applicationId 'org.ghostrain'
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '4.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // Framework-only app: no dependencies, no AndroidX.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

// ACS_SIGNING_CONFIG_START
def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasReleaseSigning =
        keystoreProperties['RELEASE_STORE_FILE'] &&
        keystoreProperties['RELEASE_STORE_PASSWORD'] &&
        keystoreProperties['RELEASE_KEY_ALIAS'] &&
        keystoreProperties['RELEASE_KEY_PASSWORD']

android {
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
// ACS_SIGNING_CONFIG_END
